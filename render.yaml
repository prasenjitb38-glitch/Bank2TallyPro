services:
  - type: web
    name: bank2tally-suite
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TALLY_BRIDGE_URL
        sync: false
      - key: TALLY_BRIDGE_TOKEN
        sync: false
